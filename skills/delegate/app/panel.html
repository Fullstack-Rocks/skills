<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delegate</title>
<style>
  /* Host variables (MCP Apps theming) win; these are the fallbacks. */
  :root {
    color-scheme: light dark;
    --bg: var(--color-background-primary, light-dark(#ffffff, #1a1a19));
    --bg-2: var(--color-background-secondary, light-dark(#f5f4f0, #262624));
    --fg: var(--color-text-primary, light-dark(#1f1e1d, #f2f1ee));
    --fg-2: var(--color-text-secondary, light-dark(#6b6a66, #a3a29d));
    --line: var(--color-border-tertiary, light-dark(#e6e4dd, #3a3936));
    --danger: var(--color-text-danger, #d4533b);
    --radius: var(--border-radius-md, 8px);
    --sans: var(--font-sans, ui-sans-serif, system-ui, -apple-system, sans-serif);
    --mono: var(--font-mono, ui-monospace, "SF Mono", Menlo, monospace);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 var(--sans); }
  .wrap { display: flex; flex-direction: column; gap: 10px; padding: 12px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .tab { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--line);
         border-radius: 999px; background: transparent; color: var(--fg-2); font: inherit; cursor: pointer; }
  .tab.on { background: var(--bg-2); color: var(--fg); border-color: var(--fg-2); }
  .tab .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .5; }
  .tab .dot.run { background: #3fb950; opacity: 1; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .tab .dot.run { animation: none; } }
  .head { display: flex; align-items: center; gap: 8px; color: var(--fg-2); }
  .head b { color: var(--fg); }
  .top { position: sticky; top: 0; z-index: 1; display: flex; flex-direction: column; gap: 8px; padding-bottom: 8px; background: var(--bg); }
  .model { display: flex; align-items: center; gap: 6px; color: var(--fg-2); font-size: 12px; }
  .model select { font: inherit; color: var(--fg); background: var(--bg-2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
  .logo { width: 16px; height: 16px; flex: none; display: inline-flex; }
  .logo svg { width: 100%; height: 100%; }
  .log { display: flex; flex-direction: column; gap: 8px; max-height: 460px; overflow-y: auto;
         padding: 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-2); }
  .ev { display: flex; gap: 8px; align-items: flex-start; }
  .ev .logo { margin-top: 2px; }
  .ev .body { min-width: 0; flex: 1; overflow-wrap: anywhere; position: relative; user-select: text; -webkit-user-select: text; }
  .ev .copy { position: absolute; top: 0; right: 0; opacity: 0; transition: opacity .15s; font: 11px var(--sans);
              color: var(--fg-2); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; cursor: pointer; }
  .ev:hover .copy, .ev .copy:focus-visible { opacity: 1; }
  .ev .folded { max-height: 11.5em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
  .ev .more { margin-top: 2px; padding: 0; border: 0; background: none; color: var(--fg-2); font: 12px var(--sans); cursor: pointer; text-decoration: underline; }
  .who { font-weight: 600; }
  .tool, .tool_result { font: 12px/1.4 var(--mono); color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thinking { color: var(--fg-2); font-style: italic; }
  .error { color: var(--danger); }
  .final { border-left: 2px solid var(--accent, var(--line)); padding-left: 8px; }
  .final pre { background: var(--bg); padding: 8px; border-radius: 6px; overflow-x: auto; font: 12px/1.4 var(--mono); }
  .final code { font: 12px var(--mono); }
  .final p { margin: 4px 0; }
  .meta { color: var(--fg-2); font-size: 12px; }
  .empty { color: var(--fg-2); }
  form { display: flex; gap: 8px; }
  textarea { flex: 1; min-height: 38px; resize: vertical; padding: 8px; border: 1px solid var(--line); border-radius: var(--radius);
             background: var(--bg); color: var(--fg); font: inherit; }
  button.send { padding: 0 14px; border: 0; border-radius: var(--radius); background: var(--fg); color: var(--bg); font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .working { color: var(--fg-2); display: flex; gap: 8px; align-items: center; }
  .working button { font: inherit; background: transparent; color: var(--fg-2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="tabs" id="tabs"></div>
    <div class="head" id="head"></div>
    <label class="model" id="model" hidden>Model <select id="model-pick"></select> <span>applies from the next turn</span></label>
  </div>
  <div class="log" id="log"><div class="empty">Waiting for a delegation…</div></div>
  <div id="foot"></div>
</div>
<script>
// The server replaces the line below with assets/brands.json.
const BRANDS = /*BRANDS*/{};
const brand = (who) => BRANDS[who] || BRANDS.lead || { name: who, color: "#8a8a8a", glyph: "◆", svg: "" };

// ---- MCP Apps: JSON-RPC 2.0 over postMessage with the host -------------------------------
let nextId = 1;
const pending = new Map();
function request(method, params) {
  const id = nextId++;
  window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
  return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
}
function notify(method, params) {
  window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
}
window.addEventListener("message", (event) => {
  if (event.source !== window.parent) return;
  const msg = event.data;
  if (!msg || msg.jsonrpc !== "2.0") return;
  if (msg.id !== undefined && pending.has(msg.id) && !msg.method) {
    const { resolve, reject } = pending.get(msg.id);
    pending.delete(msg.id);
    msg.error ? reject(new Error(msg.error.message)) : resolve(msg.result);
    return;
  }
  if (msg.method === "ui/resource-teardown" || msg.method === "ping") {
    window.parent.postMessage({ jsonrpc: "2.0", id: msg.id, result: {} }, "*");
  } else if (msg.method === "ui/notifications/tool-input") {
    pick(msg.params?.arguments?.id);
  } else if (msg.method === "ui/notifications/tool-result") {
    pick(msg.params?.structuredContent?.id);
  } else if (msg.method === "ui/notifications/host-context-changed") {
    applyContext(msg.params);
  }
});
async function callTool(name, args) {
  const res = await request("tools/call", { name, arguments: args });
  if (res?.isError) throw new Error(res.content?.[0]?.text || "failed");
  return res;
}
function applyContext(ctx) {
  if (!ctx) return;
  if (ctx.theme) document.documentElement.style.colorScheme = ctx.theme;
  for (const [key, value] of Object.entries(ctx.styles?.variables || {})) {
    if (value) document.documentElement.style.setProperty(key, value);
  }
}

// ---- state ------------------------------------------------------------------------------
let selected = "";    // delegation shown
let after = 0;        // events.jsonl lines already drawn
let list = [];
let finals = new Set();
let awaitingTurn = 0; // the turn the person started from this panel, reported to the model when it ends
const $ = (id) => document.getElementById(id);

function pick(id) {
  if (!id || id === selected) return;
  selected = id;
  after = 0;
  finals = new Set();
  $("log").innerHTML = "";
  poll();
}

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
function markdown(text) {
  // Just enough Markdown for agent replies: fences, inline code, bold, paragraphs.
  return esc(text)
    .replace(/```[\w-]*\n([\s\S]*?)```/g, (_, code) => `<pre>${code}</pre>`)
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
    .split(/\n{2,}/).map((p) => p.startsWith("<pre>") ? p : `<p>${p.replace(/\n/g, "<br>")}</p>`).join("");
}
function logo(who) {
  const span = document.createElement("span");
  span.className = "logo";
  span.title = brand(who).name;
  span.innerHTML = brand(who).svg; // trusted: shipped with the skill
  return span;
}

let lastReplyRow = null; // the delegate's latest message, which its reply repeats
// Long requests and replies fold to their first lines; the toggle shows all of it.
const isLong = (text) => text.length > 700 || text.split("\n").length > 8;
async function copy(text, button) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const area = Object.assign(document.createElement("textarea"), { value: text });
    document.body.append(area);
    area.select();
    document.execCommand("copy");
    area.remove();
  }
  button.textContent = "Copied";
  setTimeout(() => { button.textContent = "Copy"; }, 1200);
}
function finish(body, ev) {
  const button = Object.assign(document.createElement("button"), { className: "copy", textContent: "Copy" });
  button.onclick = () => copy(ev.text, button);
  body.append(button);
  if (!isLong(ev.text)) return;
  const content = body.querySelector(".content");
  content.classList.add("folded");
  const more = Object.assign(document.createElement("button"), { className: "more", textContent: "Show all" });
  more.onclick = () => {
    more.textContent = content.classList.toggle("folded") ? "Show all" : "Show less";
  };
  body.append(more);
}

function drawEvent(ev, harness) {
  if (ev.kind === "final") {
    finals.add(ev.text);
    if (lastReplyRow?.text === ev.text) lastReplyRow.row.remove();
  }
  if (ev.kind === "message" && ev.from === harness && finals.has(ev.text)) return;
  const row = document.createElement("div");
  row.className = "ev";
  row.append(logo(ev.from));
  const body = document.createElement("div");
  body.className = `body ${ev.kind}`;
  const b = brand(ev.from);
  if (ev.kind === "final") {
    body.style.setProperty("--accent", b.color);
    body.innerHTML = `<div class="meta"><span class="who" style="color:${b.color}">${esc(ev.from)}</span> · turn ${ev.turn} · ${ev.seconds ?? 0}s · STATUS: ${esc(ev.status || "?")}</div><div class="content">${markdown(ev.text)}</div>`;
    finish(body, ev);
  } else if (ev.kind === "message") {
    const label = ev.from === harness ? ev.from : `${ev.from} → ${harness}`;
    body.innerHTML = `<div class="who" style="color:${b.color}">${esc(label)}</div><div class="content">${esc(ev.text).replace(/\n/g, "<br>")}</div>`;
    finish(body, ev);
  } else {
    const prefix = { tool: "› ", tool_result: "↳ ", error: "✗ ", thinking: "", status: "· " }[ev.kind] ?? "";
    body.textContent = prefix + ev.text;
    body.title = ev.text;
  }
  row.append(body);
  if (ev.kind === "message" && ev.from === harness) lastReplyRow = { text: ev.text, row };
  return row;
}

function draw(data, fresh) {
  list = data.delegations;
  if (!selected && data.id) selected = data.id;
  const current = list.find((d) => d.id === selected);
  $("tabs").replaceChildren(...list.map((d) => {
    const tab = document.createElement("button");
    tab.className = "tab" + (d.id === selected ? " on" : "");
    tab.append(logo(d.harness), d.id);
    const dot = document.createElement("span");
    dot.className = "dot" + (d.status === "running" ? " run" : "");
    tab.append(dot);
    tab.onclick = () => pick(d.id);
    return tab;
  }));
  if (!current) return;
  const b = brand(current.harness);
  $("head").replaceChildren(logo(current.harness));
  $("head").insertAdjacentHTML("beforeend",
    `<b>${esc(b.name)}</b><span>${current.mode === "write" ? "writes in its worktree" : "read-only"} · ${current.turns} turns · ${esc(current.title)}</span>`);

  drawModels(current, data.models || []);
  const log = $("log");
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  if (fresh.length && log.querySelector(".empty")) log.innerHTML = "";
  for (const ev of fresh) {
    const row = drawEvent(ev, current.harness);
    if (row) log.append(row);
    if (ev.kind === "final" && awaitingTurn && ev.turn >= awaitingTurn) reportToModel(current, ev);
  }
  if (fresh.length && atBottom) log.scrollTop = log.scrollHeight;
  drawFooter(current);
}

let modelKey = "";
function drawModels(d, models) {
  const value = d.model || "default";
  const key = `${d.id}:${value}:${models.length}`;
  if (key === modelKey || !models.length) return;
  modelKey = key;
  const options = models.some((m) => m.id === value) ? models : [...models, { id: value, label: value }];
  const pick = $("model-pick");
  pick.replaceChildren(...options.map((m) => Object.assign(document.createElement("option"), { value: m.id, textContent: m.label })));
  pick.value = value;
  pick.onchange = () => callTool("delegate_model", { id: d.id, model: pick.value }).then(poll).catch(showError);
  $("model").hidden = false;
}

let footerKey = "";
function drawFooter(d) {
  const running = d.status === "running";
  const key = `${d.id}:${d.status}:${d.turns}`;
  if (key === footerKey) return;
  footerKey = key;
  const foot = $("foot");
  if (running) {
    foot.innerHTML = `<div class="working"><span>${esc(d.harness)} is working on turn ${d.turns}…</span><button id="stop">Stop</button></div>`;
    $("stop").onclick = () => callTool("delegate_stop", { id: d.id }).catch(showError);
  } else if (d.status === "closed") {
    foot.innerHTML = `<div class="meta">Closed.</div>`;
  } else {
    foot.innerHTML = `<form id="send"><textarea id="msg" placeholder="Message ${esc(d.harness)} yourself. The lead agent sees the exchange."></textarea><button class="send">Send</button></form>`;
    $("send").onsubmit = async (e) => {
      e.preventDefault();
      const text = $("msg").value.trim();
      if (!text) return;
      e.submitter && (e.submitter.disabled = true);
      try {
        await callTool("delegate_send", { id: d.id, message: text, as_user: true });
        awaitingTurn = d.turns + 1;
        poll();
      } catch (err) {
        showError(err);
        e.submitter && (e.submitter.disabled = false);
      }
    };
  }
}

// The person talked to the delegate directly: tell the lead agent, for its next turn.
async function reportToModel(d, ev) {
  awaitingTurn = 0;
  const text = `[delegate] The user messaged ${d.id} (${d.harness}) from the Delegate panel. Its reply (turn ${ev.turn}, STATUS: ${ev.status}):\n${ev.text}`;
  try { await request("ui/update-model-context", { content: [{ type: "text", text }] }); } catch {}
}

function showError(err) {
  const row = document.createElement("div");
  row.className = "ev error";
  row.textContent = `✗ ${err.message}`;
  $("log").append(row);
}

let polling = false;
async function poll() {
  if (polling) return;
  polling = true;
  try {
    const id = selected;
    const res = await callTool("delegate_poll", { id, after: id ? after : 0 });
    const data = res.structuredContent || JSON.parse(res.content[0].text);
    if (id && id !== selected) return; // the person switched tabs mid-call
    after = data.next;
    draw(data, data.events);
  } catch (err) {
    console.warn("delegate poll", err);
  } finally {
    polling = false;
  }
}

// ---- start ------------------------------------------------------------------------------
(async () => {
  const init = await request("ui/initialize", {
    appInfo: { name: "Delegate", version: "0.1.0" },
    appCapabilities: { availableDisplayModes: ["inline"] },
    protocolVersion: "2026-01-26",
  });
  applyContext(init?.hostContext);
  notify("ui/notifications/initialized", {});
  new ResizeObserver(() => {
    notify("ui/notifications/size-changed", { width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight });
  }).observe(document.body);
  poll();
  setInterval(() => { if (!document.hidden) poll(); }, 1000);
})();
</script>
</body>
</html>
