id: endpoint-route
language: Python
message: HTTP endpoint registered with a route decorator
rule:
  kind: decorated_definition
  all:
    - has:
        field: definition
        pattern: def $HANDLER($$$PARAMS)
    - has:
        kind: decorator
        has:
          pattern: route($METHOD, $PATH)
metadata:
  node: endpoint
  id: "{METHOD} {PATH}"
  link: handled-by
  to: HANDLER
