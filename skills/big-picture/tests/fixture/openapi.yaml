openapi: 3.1.0
info: { title: Fixture shop, version: "1.0" }
servers:
  - url: http://localhost:8000
paths:
  /orders/{id}/total:
    get:
      summary: An order's total
      operationId: getOrderTotal
      tags: [orders]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The total
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderTotal" }
  /customers/{ref}/orders:
    get:
      summary: A customer's orders, found through orders.meta
      tags: [customers]
      parameters:
        - { name: ref, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Order" } }
  /customers/{ref}:
    put:
      summary: Update a customer
      tags: [customers]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerUpdate" }
      responses:
        "204": { description: Updated }
components:
  schemas:
    OrderTotal:
      type: object
      required: [order_id, total_cents]
      properties:
        order_id: { type: integer }
        total_cents: { type: integer }
    Order:
      type: object
      required: [id]
      properties:
        id: { type: integer }
        total_cents: { type: integer }
        customer: { $ref: "#/components/schemas/CustomerUpdate" }
    CustomerUpdate:
      type: object
      properties:
        email: { type: string }
