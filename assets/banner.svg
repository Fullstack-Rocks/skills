      50%  { transform: translate(60px, -26px) scale(1.15); }
      100% { transform: translate(220px, 12px) scale(0.95); }
    }
    @keyframes breathe { from { opacity: 0.7; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .blob, .glow { animation: none; } }
